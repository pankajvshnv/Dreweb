name: Deploy CI/CD

on:
  push:
    branches:
      - main

# Prevent concurrent deployments — cancel any in-progress run when a new one starts
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22

          script: |
            set -e

            echo "Connected to VPS successfully!"

            cd /opt/dreweb/Dreweb

            echo "Synchronizing with origin/main..."
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            echo "Building and deploying (containers stay alive during build)..."
            docker compose build

            echo "Applying updates (replaces only changed containers, no downtime)..."
            docker compose up -d

            echo "Checking container status..."
            docker compose ps

            echo "Deployment completed successfully!"
