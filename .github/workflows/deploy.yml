name: Deploy CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22

          script: |
            set -e

            echo "Connected to VPS successfully!"

            cd /opt/dreweb/Dreweb

            echo "Synchronizing with origin/main..."
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            echo "Building new images and performing rolling update..."
            docker compose build --no-cache

            echo "Restarting containers with new images (keeps port 80 alive during deploy)..."
            docker compose up -d --force-recreate --no-deps backend frontend

            echo "Checking container status..."
            docker compose ps

            echo "Deployment completed successfully!"
