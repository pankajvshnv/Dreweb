# Main site
server {
    listen 80 default_server;
    server_name dreweb.online localhost _;
    client_max_body_size 50M;

    # 1. Enable Gzip Compression for fast load times
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json;

    # 2. Dynamic Sitemap and RSS feeds from live PostgreSQL
    location ~* ^/(sitemap\.xml|rss\.xml|feed\.xml)$ {
        proxy_pass http://backend:5000/api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve sitemap.xsl with proper text/xml MIME type
    location ~* \.xsl$ {
        root /usr/share/nginx/html;
        default_type text/xml;
        add_header Content-Type "text/xml; charset=utf-8";
    }

    # 2b. Global Security Headers (Prevent Phishing, Clickjacking, MIME sniffing)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 3. Admin portal routes (Prevent search crawlers from indexing private CMS login)
    location ^~ /admin {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 4. Serve Static React Frontend (SPA routing)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 3. Cache static assets (CSS, JS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Proxy API requests to the Node.js Express backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Proxy uploads to the backend media folder
    location ^~ /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Redirect www → non-www
server {
    listen 80;
    server_name www.dreweb.online;
    return 301 https://dreweb.online$request_uri;
}

